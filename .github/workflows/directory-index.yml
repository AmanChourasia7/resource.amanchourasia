name: Generate Directory Indexes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  directory-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate directory indexes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime
          from html import escape

          ROOT = Path(".").resolve()

          SKIP = {
              ".git",
              ".github"
          }

          def skipped(path):
              return any(part in SKIP for part in path.parts)

          def format_size(size):
              if size < 1024:
                  return f"{size} B"
              if size < 1024 * 1024:
                  return f"{size / 1024:.1f} kB"
              if size < 1024 * 1024 * 1024:
                  return f"{size / (1024 * 1024):.1f} MB"
              return f"{size / (1024 * 1024 * 1024):.1f} GB"

          def format_date(timestamp):
              return datetime.fromtimestamp(
                  timestamp
              ).strftime("%m/%d/%y, %I:%M:%S %p").lstrip("0").replace(
                  "/0", "/"
              )

          def get_title(directory):
              relative = directory.relative_to(ROOT)

              if str(relative) == ".":
                  return "/"

              return "/" + relative.as_posix() + "/"

          directories = [ROOT]

          for path in ROOT.rglob("*"):
              if path.is_dir() and not skipped(path):
                  directories.append(path)

          for directory in sorted(directories):

              if skipped(directory):
                  continue

              entries = []

              try:
                  children = list(directory.iterdir())
              except PermissionError:
                  continue

              for item in children:

                  if item.name == "index.html":
                      continue

                  if item.name.startswith("."):
                      continue

                  if skipped(item):
                      continue

                  try:
                      stat = item.stat()
                      modified = format_date(stat.st_mtime)
                  except OSError:
                      modified = ""

                  if item.is_dir():

                      entries.append({
                          "name": item.name,
                          "href": item.name + "/",
                          "size": "",
                          "date": modified,
                          "directory": True
                      })

                  elif item.is_file():

                      try:
                          size = format_size(stat.st_size)
                      except OSError:
                          size = ""

                      entries.append({
                          "name": item.name,
                          "href": item.name,
                          "size": size,
                          "date": modified,
                          "directory": False
                      })

              entries.sort(
                  key=lambda x: (
                      not x["directory"],
                      x["name"].lower()
                  )
              )

              rows = []

              if directory != ROOT:
                  rows.append("""
                    <tr class="parent">
                      <td class="icon"></td>
                      <td class="name">
                        <a href="../">[parent directory]</a>
                      </td>
                      <td class="size"></td>
                      <td class="date"></td>
                    </tr>
                  """)

              for entry in entries:

                  if entry["directory"]:
                      icon = "📁"
                      display_name = entry["name"] + "/"
                  else:
                      icon = "📄"
                      display_name = entry["name"]

                  rows.append(f"""
                    <tr>
                      <td class="icon">{icon}</td>
                      <td class="name">
                        <a href="{escape(entry["href"], quote=True)}">
                          {escape(display_name)}
                        </a>
                      </td>
                      <td class="size">{entry["size"]}</td>
                      <td class="date">{entry["date"]}</td>
                    </tr>
                  """)

              title = escape(get_title(directory))

              html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>Index of {title}</title>

            <style>

              * {{
                box-sizing: border-box;
              }}

              html,
              body {{
                margin: 0;
                padding: 0;
              }}

              body {{
                background: #ffffff;
                color: #111111;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Helvetica,
                  Arial,
                  sans-serif;
                font-size: 15px;
              }}

              .container {{
                max-width: 1200px;
                margin: 0 auto;
                padding: 32px 24px 60px;
              }}

              h1 {{
                margin: 0;
                font-size: 30px;
                line-height: 1.3;
                font-weight: 600;
                letter-spacing: -0.4px;
              }}

              .path {{
                margin-top: 7px;
                color: #777;
                font-size: 13px;
                font-family:
                  SFMono-Regular,
                  Consolas,
                  "Liberation Mono",
                  monospace;
              }}

              .listing {{
                margin-top: 24px;
                border: 1px solid #e1e4e8;
                border-radius: 8px;
                overflow: hidden;
                background: #fff;
              }}

              table {{
                width: 100%;
                border-collapse: collapse;
              }}

              thead {{
                background: #f6f8fa;
              }}

              th {{
                padding: 11px 16px;
                border-bottom: 1px solid #e1e4e8;
                color: #57606a;
                font-size: 12px;
                font-weight: 600;
                text-align: left;
                text-transform: uppercase;
                letter-spacing: .04em;
              }}

              td {{
                padding: 10px 16px;
                border-bottom: 1px solid #f0f1f2;
                vertical-align: middle;
              }}

              tr:last-child td {{
                border-bottom: 0;
              }}

              tbody tr:hover {{
                background: #f6f8fa;
              }}

              td.icon {{
                width: 44px;
                padding-right: 0;
                text-align: center;
                font-size: 18px;
              }}

              td.name {{
                width: auto;
              }}

              td.size {{
                width: 120px;
                color: #6e7781;
                text-align: right;
                white-space: nowrap;
              }}

              td.date {{
                width: 210px;
                color: #6e7781;
                white-space: nowrap;
              }}

              a {{
                color: #0969da;
                text-decoration: none;
              }}

              a:hover {{
                text-decoration: underline;
              }}

              .parent td {{
                background: #fafbfc;
              }}

              .parent a {{
                color: #57606a;
              }}

              @media (max-width: 700px) {{

                .container {{
                  padding: 20px 12px 40px;
                }}

                h1 {{
                  font-size: 24px;
                }}

                .listing {{
                  overflow-x: auto;
                }}

                table {{
                  min-width: 700px;
                }}

              }}

            </style>

          </head>

          <body>

            <main class="container">

              <h1>Index of {title}</h1>

              <div class="path">
                Directory listing
              </div>

              <div class="listing">

                <table>

                  <thead>
                    <tr>
                      <th></th>
                      <th>Name</th>
                      <th>Size</th>
                      <th>Date modified</th>
                    </tr>
                  </thead>

                  <tbody>

                    {''.join(rows)}

                  </tbody>

                </table>

              </div>

            </main>

          </body>
          </html>
          """

              (directory / "index.html").write_text(
                  html,
                  encoding="utf-8"
              )

          PY

      - name: Commit generated indexes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '**/index.html' 'index.html'

          if git diff --cached --quiet; then
            echo "No directory index changes."
          else
            git commit -m "Generate directory indexes"
            git push
          fi
