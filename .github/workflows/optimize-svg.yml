name: Optimize SVGs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: svg-optimizer-npm-${{ runner.os }}-${{ hashFiles('.github/workflows/optimize-svg.yml') }}
          restore-keys: |
            svg-optimizer-npm-${{ runner.os }}-

      - name: Optimize all SVG files
        run: |
          npx --yes svgo@4 \
            --recursive \
            --folder . \
            --multipass \
            --final-newline

      - name: Commit optimized SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.svg'

          if git diff --cached --quiet; then
            echo "No SVG changes."
          else
            git commit -m "Optimize SVG assets"
            git push
          fi
