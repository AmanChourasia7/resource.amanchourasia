<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>/images</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    main {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 28px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
    }

    li:hover {
      background: #f7f7f7;
    }

    a {
      color: #1565c0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .directory a {
      font-weight: 600;
    }

    .file a {
      font-weight: 400;
    }

    span {
      display: inline-block;
      width: 25px;
    }
  </style>
</head>

<body>
  <main>
    <h1>/images</h1>

    <ul>
      <li class="directory"><span>📁</span> <a href="homepage/">homepage/</a></li>
    </ul>
  </main>
</body>
</html>
