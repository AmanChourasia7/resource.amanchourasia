name: Optimize SVGs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SVGO
        run: npm install -g svgo@4

      - name: Optimize SVGs
        shell: bash
        run: |
          set +e

          find . -type f -name "*.svg" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Optimizing: $file"

            svgo \
              --multipass \
              --input "$file" \
              --output "$file"

            status=$?

            if [ $status -ne 0 ]; then
              echo "::warning file=$file::SVGO could not optimize this SVG. Original file kept."
              git checkout -- "$file"
            fi
          done

      - name: Commit optimized SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.svg'

          if git diff --cached --quiet; then
            echo "No SVG changes."
          else
            git commit -m "Optimize SVG assets"
            git push
          fi
