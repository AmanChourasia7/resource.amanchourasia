name: Generate Directory Indexes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  directory-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate directory indexes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime
          from html import escape

          ROOT = Path(".").resolve()

          SKIP_DIRECTORIES = {
              ".git",
              ".github"
          }

          def is_skipped(path):
              return any(
                  part in SKIP_DIRECTORIES
                  for part in path.parts
              )

          def format_size(size):
              if size < 1024:
                  return f"{size} B"

              if size < 1024 * 1024:
                  return f"{size / 1024:.1f} kB"

              if size < 1024 * 1024 * 1024:
                  return f"{size / (1024 * 1024):.1f} MB"

              return f"{size / (1024 * 1024 * 1024):.1f} GB"

          def format_date(timestamp):
              return datetime.fromtimestamp(
                  timestamp
              ).strftime("%m/%d/%y, %I:%M:%S %p").lstrip("0").replace(
                  "/0", "/"
              )

          def directory_title(directory):
              relative = directory.relative_to(ROOT)

              if str(relative) == ".":
                  return "/"

              return "/" + relative.as_posix() + "/"

          directories = [ROOT]

          for path in ROOT.rglob("*"):
              if path.is_dir() and not is_skipped(path):
                  directories.append(path)

          for directory in sorted(directories):
              if is_skipped(directory):
                  continue

              entries = []

              try:
                  children = list(directory.iterdir())
              except PermissionError:
                  continue

              for item in children:

                  if item.name == "index.html":
                      continue

                  if item.name.startswith("."):
                      continue

                  if is_skipped(item):
                      continue

                  try:
                      stat = item.stat()
                      modified = format_date(stat.st_mtime)
                  except OSError:
                      modified = ""

                  if item.is_dir():
                      entries.append({
                          "name": item.name,
                          "href": item.name + "/",
                          "size": "",
                          "modified": modified,
                          "directory": True
                      })

                  elif item.is_file():
                      try:
                          size = format_size(item.stat().st_size)
                      except OSError:
                          size = ""

                      entries.append({
                          "name": item.name,
                          "href": item.name,
                          "size": size,
                          "modified": modified,
                          "directory": False
                      })

              entries.sort(
                  key=lambda entry: (
                      not entry["directory"],
                      entry["name"].lower()
                  )
              )

              rows = []

              if directory != ROOT:
                  rows.append("""
              <tr>
                <td class="name">
                  <a href="../">[parent directory]</a>
                </td>
                <td class="size"></td>
                <td class="date"></td>
              </tr>
          """)

              for entry in entries:
                  name = escape(entry["name"])
                  href = escape(entry["href"], quote=True)

                  if entry["directory"]:
                      display_name = name + "/"
                  else:
                      display_name = name

                  rows.append(f"""
              <tr>
                <td class="name">
                  <a href="{href}">{display_name}</a>
                </td>
                <td class="size">{entry["size"]}</td>
                <td class="date">{entry["modified"]}</td>
              </tr>
          """)

              title = escape(directory_title(directory))

              html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">

            <title>Index of {title}</title>

            <style type="text/css">

              html,
              body {{
                margin: 0;
                padding: 0;
              }}

              body {{
                background: #ffffff;
                color: #000000;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 16px;
                padding: 8px;
              }}

              h1 {{
                font-family: Arial, Helvetica, sans-serif;
                font-size: 36px;
                line-height: 42px;
                margin: 0 0 8px 0;
                padding: 0;
                font-weight: bold;
              }}

              hr {{
                height: 1px;
                border: 0;
                border-top: 1px solid #c0c0c0;
                margin: 8px 0 12px 0;
                padding: 0;
              }}

              table {{
                border-collapse: collapse;
                border-spacing: 0;
                margin: 0;
                padding: 0;
              }}

              th {{
                font-family: Arial, Helvetica, sans-serif;
                font-size: 16px;
                font-weight: bold;
                text-align: left;
                padding: 2px 24px 6px 0;
                white-space: nowrap;
              }}

              td {{
                font-family: Arial, Helvetica, sans-serif;
                font-size: 16px;
                padding: 2px 24px 2px 0;
                vertical-align: middle;
                white-space: nowrap;
              }}

              td.name {{
                min-width: 300px;
              }}

              td.size {{
                min-width: 90px;
                text-align: right;
              }}

              td.date {{
                min-width: 190px;
                padding-left: 20px;
              }}

              a {{
                color: #0000ee;
                text-decoration: underline;
              }}

              a:visited {{
                color: #551a8b;
              }}

              a:hover {{
                color: #0000ee;
                text-decoration: underline;
              }}

            </style>
          </head>

          <body>

            <h1>Index of {title}</h1>

            <hr>

            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Size</th>
                  <th>Date modified</th>
                </tr>
              </thead>

              <tbody>
                {''.join(rows)}
              </tbody>
            </table>

          </body>
          </html>
          """

              (directory / "index.html").write_text(
                  html,
                  encoding="utf-8"
              )

          PY

      - name: Commit generated indexes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '**/index.html' 'index.html'

          if git diff --cached --quiet; then
            echo "No directory index changes."
          else
            git commit -m "Generate directory indexes"
            git push
          fi
