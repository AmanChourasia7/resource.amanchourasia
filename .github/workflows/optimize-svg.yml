name: Optimize SVGs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize SVG files
        run: |
          npx --yes svgo@4 \
            --recursive \
            --folder . \
            --multipass \
            --pretty false \
            --final-newline

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.svg'

          if git diff --cached --quiet; then
            echo "No SVG changes detected."
            exit 0
          fi

          git commit -m "Optimize SVG assets"
          git push
