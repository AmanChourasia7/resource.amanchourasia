<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Index of /images/homepage/body/</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      font-size: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .path {
      margin-top: 7px;
      color: #777;
      font-size: 13px;
      font-family:
        SFMono-Regular,
        Consolas,
        "Liberation Mono",
        monospace;
    }

    .listing {
      margin-top: 24px;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #f6f8fa;
    }

    th {
      padding: 11px 16px;
      border-bottom: 1px solid #e1e4e8;
      color: #57606a;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid #f0f1f2;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #f6f8fa;
    }

    td.icon {
      width: 44px;
      padding-right: 0;
      text-align: center;
      font-size: 18px;
    }

    td.name {
      width: auto;
    }

    td.size {
      width: 120px;
      color: #6e7781;
      text-align: right;
      white-space: nowrap;
    }

    td.date {
      width: 210px;
      color: #6e7781;
      white-space: nowrap;
    }

    a {
      color: #0969da;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .parent td {
      background: #fafbfc;
    }

    .parent a {
      color: #57606a;
    }

    @media (max-width: 700px) {

      .container {
        padding: 20px 12px 40px;
      }

      h1 {
        font-size: 24px;
      }

      .listing {
        overflow-x: auto;
      }

      table {
        min-width: 700px;
      }

    }

  </style>

</head>

<body>

  <main class="container">

    <h1>Index of /images/homepage/body/</h1>

    <div class="path">
      Directory listing
    </div>

    <div class="listing">

      <table>

        <thead>
          <tr>
            <th></th>
            <th>Name</th>
            <th>Size</th>
            <th>Date modified</th>
          </tr>
        </thead>

        <tbody>

          
          <tr class="parent">
            <td class="icon"></td>
            <td class="name">
              <a href="../">[parent directory]</a>
            </td>
            <td class="size"></td>
            <td class="date"></td>
          </tr>
        
          <tr>
            <td class="icon">📄</td>
            <td class="name">
              <a href="krishna.svg">
                krishna.svg
              </a>
            </td>
            <td class="size">352.6 kB</td>
            <td class="date">8/16/26, 07:29:02 AM</td>
          </tr>
        
          <tr>
            <td class="icon">📄</td>
            <td class="name">
              <a href="peakpx (35) (2).jpg">

              </a>
            </td>
            <td class="size">259.2 kB</td>
            <td class="date">8/16/26, 07:29:02 AM</td>
          </tr>
        
          <tr>
            <td class="icon">📄</td>
            <td class="name">
              <a href="Shree-Krishna.svg">
                Shree-Krishna.svg
              </a>
            </td>
            <td class="size">691.7 kB</td>
            <td class="date">8/16/26, 07:29:02 AM</td>
          </tr>
        

        </tbody>

      </table>

    </div>

  </main>

</body>
</html>
