name: Generate Directory Indexes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  directory-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate directory listings
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from html import escape
          import os

          ROOT = Path(".").resolve()

          SKIP = {
              ".git",
              ".github"
          }

          def is_skipped(path):
              return any(part in SKIP for part in path.parts)

          def format_size(size):
              if size < 1024:
                  return f"{size} B"
              if size < 1024 * 1024:
                  return f"{size / 1024:.1f} kB"
              if size < 1024 * 1024 * 1024:
                  return f"{size / (1024 * 1024):.1f} MB"
              return f"{size / (1024 * 1024 * 1024):.1f} GB"

          def format_date(timestamp):
              dt = datetime.fromtimestamp(timestamp)
              return dt.strftime("%-m/%-d/%y, %-I:%M:%S %p")

          def relative_path(path):
              return path.relative_to(ROOT).as_posix()

          directories = [ROOT]

          for directory in ROOT.rglob("*"):
              if directory.is_dir() and not is_skipped(directory):
                  directories.append(directory)

          for directory in sorted(directories):
              if is_skipped(directory):
                  continue

              entries = []

              try:
                  children = list(directory.iterdir())
              except PermissionError:
                  continue

              for item in children:
                  if item.name == "index.html":
                      continue

                  if item.name.startswith("."):
                      continue

                  if is_skipped(item):
                      continue

                  try:
                      modified = item.stat().st_mtime
                  except OSError:
                      modified = 0

                  if item.is_dir():
                      entries.append({
                          "name": item.name,
                          "href": item.name + "/",
                          "size": "",
                          "date": format_date(modified),
                          "directory": True
                      })

                  elif item.is_file():
                      entries.append({
                          "name": item.name,
                          "href": item.name,
                          "size": format_size(item.stat().st_size),
                          "date": format_date(modified),
                          "directory": False
                      })

              entries.sort(
                  key=lambda x: (
                      not x["directory"],
                      x["name"].lower()
                  )
              )

              rows = []

              if directory != ROOT:
                  rows.append("""
          <tr>
            <td class="icon">🔙</td>
            <td><a href="../">[parent directory]</a></td>
            <td></td>
            <td></td>
          </tr>
          """)

              for entry in entries:
                  icon = "📁" if entry["directory"] else "📄"

                  rows.append(f"""
          <tr>
            <td class="icon">{icon}</td>
            <td><a href="{escape(entry["href"], quote=True)}">{escape(entry["name"])}{'/' if entry["directory"] else ''}</a></td>
            <td>{entry["size"]}</td>
            <td>{entry["date"]}</td>
          </tr>
          """)

              path_name = relative_path(directory)

              if path_name == ".":
                  title = "/"
              else:
                  title = "/" + path_name + "/"

              html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Index of {escape(title)}</title>

            <style>
              html, body {{
                margin: 0;
                padding: 0;
                background: #ffffff;
                color: #000000;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 16px;
              }}

              body {{
                padding: 8px;
              }}

              h1 {{
                margin: 0 0 14px 0;
                font-size: 36px;
                font-weight: bold;
              }}

              hr {{
                border: 0;
                border-top: 1px solid #c0c0c0;
                margin: 0 0 10px 0;
              }}

              table {{
                border-collapse: collapse;
                width: auto;
                min-width: 1000px;
              }}

              th {{
                text-align: left;
                font-weight: bold;
                padding: 7px 12px;
                white-space: nowrap;
              }}

              td {{
                padding: 3px 12px 3px 0;
                white-space: nowrap;
                vertical-align: middle;
              }}

              td.icon {{
                width: 28px;
                padding-right: 2px;
                font-size: 17px;
              }}

              td:nth-child(2) {{
                min-width: 300px;
              }}

              td:nth-child(3) {{
                min-width: 90px;
                text-align: right;
              }}

              td:nth-child(4) {{
                min-width: 190px;
                padding-left: 30px;
              }}

              a {{
                color: #0000ee;
                text-decoration: underline;
              }}

              a:visited {{
                color: #551a8b;
              }}

              a:hover {{
                color: #0000ee;
              }}
            </style>
          </head>

          <body>

          <h1>Index of {escape(title)}</h1>

          <hr>

          <table>
            <thead>
              <tr>
                <th></th>
                <th>Name</th>
                <th>Size</th>
                <th>Date modified</th>
              </tr>
            </thead>

            <tbody>
              {''.join(rows)}
            </tbody>
          </table>

          </body>
          </html>
          """

              (directory / "index.html").write_text(
                  html,
                  encoding="utf-8"
              )

          PY

      - name: Commit directory indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '**/index.html' 'index.html'

          if git diff --cached --quiet; then
            echo "No directory indexes changed."
          else
            git commit -m "Generate directory indexes"
            git push
          fi
